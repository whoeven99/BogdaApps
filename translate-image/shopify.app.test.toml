# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "df4ae6edd683114494f9fefef25752af"
name = "Ciwi.ai: Image & Alt (Test)"
handle = "ciwi-image-translation-test"
application_url = "https://bogdaapps.onrender.com"
embedded = true

[build]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_legal_policies,read_online_store_navigation,unauthenticated_read_product_listings,read_themes,read_translations,unauthenticated_read_metaobjects,write_app_proxy,write_locales,write_metaobjects,write_products,write_translations,write_themes"
optional_scopes = ["write_files"]
[auth]
redirect_urls = [
  "https://bogdaapps.onrender.com/auth/callback",
  "https://bogdaapps.onrender.com/auth/shopify/callback",
  "https://bogdaapps.onrender.com/api/auth/callback"
]
  
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [
  "app_purchases_one_time/update",
  "app_subscriptions/update",
  "app/uninstalled",
  "app/scopes_update"
]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[app_proxy]
url = "https://bogdaapps.onrender.com/api/storefront"
subpath = "ciwi-image-test"
prefix = "apps"

[pos]
embedded = false
