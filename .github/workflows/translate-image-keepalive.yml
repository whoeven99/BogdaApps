name: translate-image keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping TranslateImageProd healthz
        run: curl -fsS --max-time 30 https://translateimageprod.onrender.com/healthz
